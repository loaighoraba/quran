name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deploy midway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quran
          POSTGRES_PASSWORD: quran
          POSTGRES_DB: quran
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
      POSTGRES_DB: quran

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v7

      # Applies .do/app.yaml, then App Platform builds the Dockerfile, runs migrations
      # (PRE_DEPLOY job) and rolls out the new version
      - id: deploy
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          project_id: ${{ vars.DO_PROJECT_ID }}
          print_build_logs: true
          print_deploy_logs: true

      - name: Show app URLs
        env:
          APP: ${{ steps.deploy.outputs.app }}
        run: |
          {
            echo "### Deployed"
            echo "- Live URL: $(jq -r '.live_url' <<< "$APP")"
            echo "- Default ingress (Cloudflare CNAME target): $(jq -r '.default_ingress' <<< "$APP")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
